name: Build OrangeFox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          libncurses5-dev libncurses-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc

      - name: Sync OrangeFox Source
        run: |
          mkdir fox
          cd fox
          repo init --depth=1 -u https://github.com/OrangeFoxRecovery/manifest.git -b fox_14.1
          repo sync -j$(nproc)
          
      - name: Move Device Tree
        run: |
          mkdir -p fox/device/xiaomi
          cp -r $GITHUB_WORKSPACE fox/device/xiaomi/beryl

      - name: Build
        run: |
          cd fox
          source build/envsetup.sh
          lunch twrp_beryl-eng
          mka vendorbootimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-vendor_boot
          path: fox/out/target/product/beryl/vendor_boot.img
